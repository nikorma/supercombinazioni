name: Update historical archive

on:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: "Ricostruisci tutto lo storico dal 1997"
        required: false
        default: true
        type: boolean

  schedule:
    - cron: "30 21 * * 2,4,5,6"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Build archive
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_rebuild }}" = "true" ]; then
            python scripts/update_history.py --full
          else
            python scripts/update_history.py
          fi

      - name: Commit updated archive
        shell: bash
        run: |
          git config user.name "SuperCombinazioni Bot"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          if git diff --cached --quiet; then
            echo "Nessun aggiornamento"
          else
            git commit -m "Aggiorna archivio SuperEnalotto"
            git push
          fi
